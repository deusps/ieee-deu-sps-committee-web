<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEEE DEU SPS - Admin Panel</title>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- Decap CMS Styles -->
    <link href="https://unpkg.com/decap-cms@^3.0.0/dist/cms.css" rel="stylesheet">
</head>

<body>
    <!-- Decap CMS Script -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- Hata giderme: Decap CMS bazen root element arayabilir -->
    <div id="nc-root"></div>

    <script>
        // Netlify Identity Yeniden Yönlendirme Mantığı
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on('init', user => {
                if (!user) {
                    window.netlifyIdentity.on('login', () => {
                        document.location.href = '/admin/';
                    });
                }
            });
        }
    </script>
</body>

</html>
